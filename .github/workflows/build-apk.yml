name: Build and Publish Saqi VPN Debug APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
      create_release:
        description: 'Publish as GitHub Release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Debug Keystore & Environment
        run: |
          echo "Preparing build environment..."
          # Reconstruct debug.keystore if base64 is available
          if [ -f "debug.keystore.base64" ]; then
            echo "Decoding debug.keystore from base64..."
            base64 -d debug.keystore.base64 > debug.keystore
          elif [ ! -f "debug.keystore" ]; then
            echo "Generating standard debug.keystore..."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -alias androiddebugkey \
              -keypass android \
              -storepass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          # Ensure .env exists from .env.example
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
          fi

          chmod +x gradlew

      - name: Determine Version Tag
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION_TAG="${GITHUB_REF#refs/tags/}"
          elif [ -n "${{ inputs.tag_name }}" ]; then
            VERSION_TAG="${{ inputs.tag_name }}"
          else
            VERSION_TAG="v1.0.0"
          fi
          echo "VERSION_TAG=${VERSION_TAG}" >> $GITHUB_ENV
          echo "version=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "Selected Version Tag: ${VERSION_TAG}"

      - name: Build Android Debug APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK Generation
        id: verify_apk
        run: |
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "::error::Debug APK was not found at $APK_PATH"
            exit 1
          fi

          APK_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH")
          echo "APK generated successfully. Size: $APK_SIZE bytes"

          # Prepare named release file
          RELEASE_APK_NAME="Saqi-VPN-${{ env.VERSION_TAG }}-debug.apk"
          cp "$APK_PATH" "$RELEASE_APK_NAME"
          echo "RELEASE_APK_NAME=${RELEASE_APK_NAME}" >> $GITHUB_ENV
          echo "apk_path=${RELEASE_APK_NAME}" >> $GITHUB_OUTPUT

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Saqi-VPN-Debug-APK
          path: ${{ env.RELEASE_APK_NAME }}
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.create_release == true || startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "Saqi VPN ${{ env.VERSION_TAG }} (Debug Build)"
          body: |
            ### 🛡️ Saqi VPN ${{ env.VERSION_TAG }} - Android Debug Release

            Official Android Debug APK for **Saqi VPN**.

            #### 📱 App Features & Configuration:
            - **Supported Carriers:** STC (Sawa 5G/4G), Mobily, Zain KSA, and Lebara KSA.
            - **Subscription Packages:**
              - 1 Month: 20 SAR
              - 2 Months: 40 SAR
              - 3 Months: 60 SAR (Most Popular)
              - 6 Months: 120 SAR (Best Value)
            - **1-Hour Free Trial:** Built-in trial PIN request via WhatsApp.
            - **Payment Methods:** Voucher Cards, Mobile Recharge Cards, Zain Vouchers, and Local Bank Transfers.
            - **Official WhatsApp Support:** +966545328482.
            - **Bilingual Interface:** English & Arabic (عربي).
            - **Application ID:** `com.aistudio.saqivpn.kxmpzq`

            #### 📥 Installation Instructions:
            1. Download the **${{ env.RELEASE_APK_NAME }}** asset below.
            2. On your Android device, tap the downloaded APK file.
            3. If prompted, allow "Install unknown apps" in Settings for your browser/file manager.
            4. Tap **Install** and open **Saqi VPN**.
          draft: false
          prerelease: false
          files: ${{ env.RELEASE_APK_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Build Summary
        if: always()
        run: |
          echo "## 🚀 Saqi VPN Android Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ "${{ job.status }}" == "success" ]; then
            echo "✅ **Status:** Build Succeeded" >> $GITHUB_STEP_SUMMARY
            echo "- **Application ID:** \`com.aistudio.saqivpn.kxmpzq\`" >> $GITHUB_STEP_SUMMARY
            echo "- **App Name:** Saqi VPN" >> $GITHUB_STEP_SUMMARY
            echo "- **Version Tag:** \`${{ env.VERSION_TAG }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Output APK Asset:** \`${{ env.RELEASE_APK_NAME }}\`" >> $GITHUB_STEP_SUMMARY
            echo "- **Artifact Download:** Available in GitHub Actions summary artifacts" >> $GITHUB_STEP_SUMMARY
            echo "- **Release:** Published at [GitHub Releases](https://github.com/${{ github.repository }}/releases)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Status:** Build Failed. Check the step logs above for details." >> $GITHUB_STEP_SUMMARY
          fi
